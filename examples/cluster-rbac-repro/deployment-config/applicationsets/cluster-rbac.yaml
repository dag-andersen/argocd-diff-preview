apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: cluster-rbac
  namespace: argocd
  annotations:
    argocd-diff-preview/watch-pattern: "examples/cluster-rbac-repro/.*"
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  syncPolicy:
    preserveResourcesOnDeletion: true
  generators:
    - matrix:
        generators:
          - list:
              elements:
                - name: in-cluster
                - name: storyhouse-qa
          - git:
              repoURL: https://github.com/dag-andersen/argocd-diff-preview.git
              revision: HEAD
              directories:
                - path: "examples/cluster-rbac-repro/deployment-config/cluster-rbac/{{ .name }}"
  template:
    metadata:
      name: '{{ .name }}-cluster-rbac'
      annotations:
        argocd-diff-preview/watch-pattern: "examples/cluster-rbac-repro/.*"
        argocd.argoproj.io/manifest-generate-paths: .
    spec:
      project: default
      source:
        repoURL: https://github.com/dag-andersen/argocd-diff-preview.git
        targetRevision: HEAD
        path: "examples/cluster-rbac-repro/deployment-config/cluster-rbac/{{ .name }}"
      destination:
        name: "{{ .name }}"
