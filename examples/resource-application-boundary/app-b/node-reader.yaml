apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: app-b-node-reader
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: app-b-node-reader
subjects:
  - kind: Group
    name: app-b-readers
    apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: ClusterRole
  name: app-b-node-reader
  apiGroup: rbac.authorization.k8s.io
