apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: owner-a
  namespace: argocd
  annotations:
    argocd-diff-preview/watch-pattern: "examples/resource-application-boundary/owner-a/.*"
spec:
  project: default
  source:
    repoURL: https://github.com/dag-andersen/argocd-diff-preview.git
    targetRevision: HEAD
    path: examples/resource-application-boundary/owner-a
  destination:
    name: in-cluster
