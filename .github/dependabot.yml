# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  # === Docker ===
  - package-ecosystem: "docker" # See documentation for possible values
    directory: "/" # Location of package manifests
    schedule:
      interval: daily
    labels: [dependencies, docker]
    groups:
      docker-minor-patch:
        update-types: [minor, patch]

  # === GitHub Actions ===
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
    labels: [dependencies, github-actions]
    groups:
      actions-maj-min-pat:
        update-types: [major, minor, patch]

  # === gomod ===
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: daily
    labels: [dependencies, gomod]
    groups:
      gomod-minor-patch:
        update-types: [minor, patch]
    ignore:
      # k8s.io staging libs must stay on 0.34.x and Helm on 3.19.x until
      # argo-cd (pinned to k8s.io/kubernetes v1.34.x) supports k8s 1.35+.
      # k8s 1.35 removed legacy gogo-protobuf methods from k8s.io/api types
      # that argo-cd v3.3.x's generated gRPC gateway code depends on.
      - dependency-name: "k8s.io/*"
        update-types: [version-update:semver-minor]
      - dependency-name: "helm.sh/helm/v3"
        update-types: [version-update:semver-minor]
