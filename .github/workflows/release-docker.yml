name: Release Docker Images

on:
  push:
    tags:
      - "v*.*.*"
      - "!v*.*.*-pre-release"
      - "!v*.*.*-pre-release-*"
      - "!v*.*.*-experimental"

env:
  IMAGE: ghcr.io/lumyx-inc/argocd-diff-preview

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        platform: [amd64]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set env
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          echo "VERSION=${VERSION}" >> $GITHUB_ENV
          SHA=$(git rev-parse --short HEAD)
          echo "SHA=${SHA}" >> $GITHUB_ENV
          BUILD_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          echo "BUILD_DATE=${BUILD_DATE}" >> $GITHUB_ENV
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          push: true
          platforms: linux/${{ matrix.platform }}
          build-args: |
            VERSION=${{ env.VERSION }}
            COMMIT=${{ env.SHA }}
            BUILD_DATE=${{ env.BUILD_DATE }}
          tags: ${{ env.IMAGE }}:${{ env.VERSION }}-${{ matrix.platform }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  create-manifest:
    runs-on: ubuntu-latest
    needs: [build]
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set env
        run: echo "VERSION=${GITHUB_REF#refs/*/}" >> $GITHUB_ENV
      - name: create manifest
        run: |
          docker buildx imagetools create -t \
            ${IMAGE}:${VERSION} \
            ${IMAGE}:${VERSION}-amd64
          docker buildx imagetools create -t \
            ${IMAGE}:latest \
            ${IMAGE}:${VERSION}-amd64
